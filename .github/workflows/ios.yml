name: iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/**"
      - "ios/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ios-${{ runner.os }}-

      - name: Build Horizon Rust library
        run: |
          cargo build --release -p horizon-client --lib \
            --target aarch64-apple-ios --no-default-features
          mkdir -p ios/build
          cp target/aarch64-apple-ios/release/libhorizon_client.a ios/build/

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/HorizonIOS.xcodeproj \
            -scheme HorizonIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ios/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          rm -rf ios/Payload
          mkdir -p ios/Payload
          cp -R ios/derived/Build/Products/Release-iphoneos/HorizonIOS.app ios/Payload/
          cd ios
          zip -qry HorizonIOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HorizonIOS-unsigned
          path: ios/HorizonIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
